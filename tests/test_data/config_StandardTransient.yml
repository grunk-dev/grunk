settings:
  version: 7.6.2 # version of the grunk plugin
  prefix: module_name_full # optional: sets the prefix of the name for generating functons and types. Can be any of ['namespace', 'module_name', 'module_name_full', 'none'], defaults to 'none'.
  concatenate: off
  customization: off
  code_generator: occt_generator.py
name: grocc # name of the grunk plugin and name of the module on highest level
headers: # headers to be parsed for functions and types
- StandardTransientTest.hxx # this is a bad example, here are headers that should be added under the occt namespace, not a nested namespace/module