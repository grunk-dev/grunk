settings:
  version: 7.6.2 # version of the grunk plugin
  namespaces: ['abc', 'generated'] # optional: generate the code in nested namespaces, e.g. MyTool::generated
  prefix: module_name_full # optional: sets the prefix of the name for generating functons and types. Can be any of ['namespace', 'module_name', 'module_name_full', 'none'], defaults to 'none'.
  concatenate: off
  customization: off
name: foo # name of the grunk plugin and name of the module on highest level
prefix: none # optional: overwrite config
headers: # headers to be parsed for functions and types
- Foo.hxx # this is a bad example, here are headers that should be added under the occt namespace, not a nested namespace/module
whitelist: [Foo, Baz]
modules:
- name: incl # the structure of a submodule is the same as the above, except that config is missing
  headers:
  - Included.hxx
  whitelist: [Other, some_function]
