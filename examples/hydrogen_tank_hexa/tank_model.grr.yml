uses:
  grunk: 0.3.1
  grocc: 0.1.2
parameters:
  cylinder_height: !<double> 1
  radius: !<double> 1
  box_ratio: !<double> 0.5
steps:
  - !<expr> [half_cylinder_height, 0.5*cylinder_height]
  - !<expr> [half_cylinder_height_neg, -half_cylinder_height]
  - !<recipes::cylinder> [{cylinder_tmp: cylinder}, {cylinder_height: cylinder_height, radius: radius, box_ratio: box_ratio}]
  - !<recipes::dome> [{dome_tmp: dome}, {radius: radius, box_ratio: box_ratio}]
  - !<grocc::gp_Vec> [[cylinder_translation], [!<double> 0, !<double> 0, half_cylinder_height_neg]]
  - !<script>
    steps:
      - !<grocc::gp_Trsf> [[trsf], ~]
      - !<grocc::gp_Trsf::SetTranslation> [[""], [trsf, cylinder_translation]]
      - !<grocc::BRepBuilderAPI_Transform> [[cylinder], [cylinder_tmp, trsf]]
    returns:
      - cylinder
  - !<grocc::gp_Vec> [[dome_top_translation], [!<double> 0, !<double> 0, half_cylinder_height]]
  - !<script>
    steps:
      - !<grocc::gp_Trsf> [[trsf], ~]
      - !<grocc::gp_Trsf::SetTranslation> [[""], [trsf, dome_top_translation]]
      - !<grocc::BRepBuilderAPI_Transform> [[dome_top], [dome_tmp, trsf]]
    returns:
      - dome_top
  - !<grocc::gp_Pnt> [[origin], [!<double> 0, !<double> 0, !<double> 0]]
  - !<grocc::gp_Dir> [[z_axis], [!<double> 0, !<double> 0, !<double> -1]]
  - !<script>
    steps:
      - !<grocc::gp_Ax1> [[ax1],[origin, z_axis]]
      - !<grocc::gp_Trsf> [[trsf], ~]
      - !<grocc::gp_Trsf::SetMirror> [[""], [trsf, origin]]
      - !<grocc::BRepBuilderAPI_Transform> [[dome_bottom], [dome_top, trsf]]
    returns:
      - dome_bottom
  - !<script>
    steps:
      - !<grocc::TopoDS_Compound> [[tank], ~]
      - !<grocc::BRep_Builder> [[builder], ~]
      - !<grocc::BRep_Builder::MakeCompound> [~, [builder, tank]]
      - !<grocc::BRep_Builder::Add> [~, [builder, tank, cylinder]]
      - !<grocc::BRep_Builder::Add> [~, [builder, tank, dome_top]]
      - !<grocc::BRep_Builder::Add> [~, [builder, tank, dome_bottom]]
    returns:
      - tank
recipes:
  dome:
    uses:
      grunk: 0.3.1
      grocc: 0.1.2
    parameters:
      radius: !<double> 1
      box_ratio: !<double> 0.5
    steps:
      - !<grocc::BRepPrimAPI_MakeBox> [[coord_axis], [!<double> 3, !<double> 2, !<double> 1]]
      - !<expr> [box_width, 2*box_ratio*radius]
      - !<expr> [half_box_width, box_ratio*radius]
      - !<expr> [half_box_width_neg, -half_box_width]
      - !<grocc::gp_Vec> [[box_translation], [half_box_width_neg, half_box_width_neg, !<double> 0]]
      - !<script>
        steps:
          - !<grocc::BRepPrimAPI_MakeBox> [[box], [box_width, box_width, half_box_width]]
          - !<grocc::gp_Trsf> [[trsf], ~]
          - !<grocc::gp_Trsf::SetTranslation> [[""], [trsf, box_translation]]
          - !<grocc::BRepBuilderAPI_Transform> [[dome_core], [box, trsf]]
        returns:
          - dome_core
      - !<expr> [angle_start_top, -_pi/4]
      - !<expr> [angle_end_top, _pi/4]
      - !<expr> [ninetydeg, _pi/2]
      - !<expr> [ninetydeg_neg, -ninetydeg]
      - !<recipes::spherical_segment> [{dome_wedge_top_segment: segment}, {radius: radius, angle1_start: angle_start_top, angle1_end: angle_end_top, angle2_start: angle_start_top, angle2_end: angle_end_top}]
      - !<grocc::gp_Pnt> [[origin], [!<double> 0, !<double> 0, !<double> 0]]
      - !<grocc::gp_Dir> [[y_axis], [!<double> 0, !<double> 1, !<double> 0]]
      - !<script>
        steps:
          - !<grocc::gp_Ax1> [[ax1],[origin, y_axis]]
          - !<grocc::gp_Trsf> [[trsf], ~]
          - !<grocc::gp_Trsf::SetRotation> [[""], [trsf, ax1, ninetydeg_neg]]
          - !<grocc::BRepBuilderAPI_Transform> [[dome_wedge_top_uncut], [dome_wedge_top_segment, trsf]]
          - !<grocc::BRepAlgoAPI_Cut> [[dome_wedge_top], [dome_wedge_top_uncut, dome_core]]
        returns:
          - dome_wedge_top
      - !<expr> [angle1_start_side, -_pi/4]
      - !<expr> [angle1_end_side, _pi/4]
      - !<expr> [angle2_start_side, -_pi/4]
      - !<expr> [angle2_end_side, 0]
      - !<recipes::spherical_segment> [{dome_wedge_side_segment: segment}, {radius: radius, angle1_start: angle1_start_side, angle1_end: angle1_end_side, angle2_start: angle2_start_side, angle2_end: angle2_end_side}]
      - !<grocc::BRepAlgoAPI_Cut> [[dome_wedge_side0], [dome_wedge_side_segment, dome_core]]
      - !<script>
        steps:
          - !<grocc::gp_Ax1> [[ax1],[]]
          - !<grocc::gp_Trsf> [[trsf], ~]
          - !<grocc::gp_Trsf::SetRotation> [[""], [trsf, ax1, ninetydeg]]
          - !<grocc::BRepBuilderAPI_Transform> [[dome_wedge_side1], [dome_wedge_side0, trsf]]
        returns:
          - dome_wedge_side1
      - !<script>
        steps:
          - !<grocc::gp_Ax1> [[ax1],[]]
          - !<grocc::gp_Trsf> [[trsf], ~]
          - !<grocc::gp_Trsf::SetRotation> [[""], [trsf, ax1, ninetydeg]]
          - !<grocc::BRepBuilderAPI_Transform> [[dome_wedge_side2], [dome_wedge_side1, trsf]]
        returns:
          - dome_wedge_side2
      - !<script>
        steps:
          - !<grocc::gp_Ax1> [[ax1],[]]
          - !<grocc::gp_Trsf> [[trsf], ~]
          - !<grocc::gp_Trsf::SetRotation> [[""], [trsf, ax1, ninetydeg]]
          - !<grocc::BRepBuilderAPI_Transform> [[dome_wedge_side3], [dome_wedge_side2, trsf]]
        returns:
          - dome_wedge_side3
      - !<script>
        steps:
          - !<grocc::TopoDS_Compound> [[dome], ~]
          - !<grocc::BRep_Builder> [[builder], ~]
          - !<grocc::BRep_Builder::MakeCompound> [~, [builder, dome]]
          - !<grocc::BRep_Builder::Add> [~, [builder, dome, dome_core]]
          - !<grocc::BRep_Builder::Add> [~, [builder, dome, dome_wedge_side0]]
          - !<grocc::BRep_Builder::Add> [~, [builder, dome, dome_wedge_side1]]
          - !<grocc::BRep_Builder::Add> [~, [builder, dome, dome_wedge_side2]]
          - !<grocc::BRep_Builder::Add> [~, [builder, dome, dome_wedge_side3]]
          - !<grocc::BRep_Builder::Add> [~, [builder, dome, dome_wedge_top]]
        returns:
          - dome
    recipes:
      spherical_segment:
        uses:
          grunk: 0.3.1
          grocc: 0.1.2
        parameters:
          radius: !<double> 1
          angle1_start: !<double> -0.75
          angle1_end: !<double> 0.75
          angle2_start: !<double> -0.75
          angle2_end: !<double> 0.75
        steps:
          - !<expr> [angle1, angle1_end - angle1_start]
          - !<expr> [angle2, angle2_end - angle2_start]
          - !<grocc::gp_Pnt> [[origin], [!<double> 0, !<double> 0, !<double> 0]]
          - !<expr> [cr1, cos(angle1_start)*radius]
          - !<expr> [sr1, sin(angle1_start)*radius]
          - !<grocc::gp_Dir> [[dir11], [!<double> 0, !<double> 0, !<double> 1]]
          - !<grocc::gp_Dir> [[dir12], [cr1, sr1, !<double> 0]]
          - !<grocc::gp_Ax2> [[ax_1], [origin, dir11, dir12]]
          - !<grocc::BRepPrimAPI_MakeSphere> [[wedge_1], [ax_1, radius, angle1]]
          - !<expr> [cr2, cos(angle2_start)*radius]
          - !<expr> [sr2, -sin(angle2_start)*radius]
          - !<grocc::gp_Dir> [[dir21], [!<double> 0, !<double> 1, !<double> 0]]
          - !<grocc::gp_Dir> [[dir22], [cr2, !<double> 0, sr2]]
          - !<grocc::gp_Ax2> [[ax_2], [origin, dir21, dir22]]
          - !<grocc::BRepPrimAPI_MakeSphere> [[wedge_2], [ax_2, radius, angle2]]
          - !<grocc::BRepAlgoAPI_Common> [[segment],[wedge_1, wedge_2]]
  cylinder:
    uses:
      grunk: 0.3.1
      grocc: 0.1.2
    parameters:
      cylinder_height: !<double> 1
      radius: !<double> 1
      box_ratio: !<double> 0.5
    steps:
      - !<recipes::cylinder_segment> [{cylinder_face0: face}, {radius: radius, box_ratio: box_ratio}]
      - !<expr> [ninetydeg, _pi/2]
      - !<script>
        steps:
          - !<grocc::gp_Ax1> [[ax1],[]]
          - !<grocc::gp_Trsf> [[trsf], ~]
          - !<grocc::gp_Trsf::SetRotation> [[""], [trsf, ax1, ninetydeg]]
          - !<grocc::BRepBuilderAPI_Transform> [[cylinder_face1], [cylinder_face0, trsf]]
        returns:
          - cylinder_face1
      - !<script>
        steps:
          - !<grocc::gp_Ax1> [[ax1],[]]
          - !<grocc::gp_Trsf> [[trsf], ~]
          - !<grocc::gp_Trsf::SetRotation> [[""], [trsf, ax1, ninetydeg]]
          - !<grocc::BRepBuilderAPI_Transform> [[cylinder_face2], [cylinder_face1, trsf]]
        returns:
          - cylinder_face2
      - !<script>
        steps:
          - !<grocc::gp_Ax1> [[ax1],[]]
          - !<grocc::gp_Trsf> [[trsf], ~]
          - !<grocc::gp_Trsf::SetRotation> [[""], [trsf, ax1, ninetydeg]]
          - !<grocc::BRepBuilderAPI_Transform> [[cylinder_face3], [cylinder_face2, trsf]]
        returns:
          - cylinder_face3
      - !<grocc::gp_Vec> [[zdir], [!<double> 0, !<double> 0, cylinder_height]]
      - !<grocc::BRepPrimAPI_MakePrism> [[cylinder_segment0], [cylinder_face0, zdir]]
      - !<grocc::BRepPrimAPI_MakePrism> [[cylinder_segment1], [cylinder_face1, zdir]]
      - !<grocc::BRepPrimAPI_MakePrism> [[cylinder_segment2], [cylinder_face2, zdir]]
      - !<grocc::BRepPrimAPI_MakePrism> [[cylinder_segment3], [cylinder_face3, zdir]]
      - !<expr> [box_width, 2 * box_ratio * radius]
      - !<grocc::BRepPrimAPI_MakeBox> [[cylinder_core_untranslated], [box_width, box_width, cylinder_height]]
      - !<expr> [half_box_width_neg, -box_ratio * radius]
      - !<grocc::gp_Vec> [[box_translation], [half_box_width_neg, half_box_width_neg, !<double> 0]]
      - !<script>
        steps:
          - !<grocc::gp_Trsf> [[trsf], ~]
          - !<grocc::gp_Trsf::SetTranslation> [[""], [trsf, box_translation]]
          - !<grocc::BRepBuilderAPI_Transform> [[cylinder_core], [cylinder_core_untranslated, trsf]]
        returns:
          - cylinder_core
      - !<script>
        steps:
          - !<grocc::TopoDS_Compound> [[cylinder], ~]
          - !<grocc::BRep_Builder> [[builder], ~]
          - !<grocc::BRep_Builder::MakeCompound> [~, [builder, cylinder]]
          - !<grocc::BRep_Builder::Add> [~, [builder, cylinder, cylinder_core]]
          - !<grocc::BRep_Builder::Add> [~, [builder, cylinder, cylinder_segment0]]
          - !<grocc::BRep_Builder::Add> [~, [builder, cylinder, cylinder_segment1]]
          - !<grocc::BRep_Builder::Add> [~, [builder, cylinder, cylinder_segment2]]
          - !<grocc::BRep_Builder::Add> [~, [builder, cylinder, cylinder_segment3]]
        returns:
          - cylinder
    recipes:
      cylinder_segment:
        uses:
          grunk: 0.3.1
          grocc: 0.1.2
        parameters:
          radius: !<double> 1
          box_ratio: !<double> 0.5
        steps:
          - !<expr> [half_box_width, box_ratio * radius]
          - !<grocc::gp_Pnt> [[p1], [half_box_width, half_box_width, !<double> 0]]
          - !<expr> [half_box_width_neg, -half_box_width]
          - !<grocc::gp_Pnt> [[p2], [half_box_width_neg, half_box_width, !<double> 0]]
          - !<grocc::BRepBuilderAPI_MakeEdge> [[edge1], [p2, p1]]
          - !<expr> [diagonal_width, (1/sqrt(2)) * radius]
          - !<grocc::gp_Pnt> [[p3], [diagonal_width, diagonal_width, !<double> 0]]
          - !<grocc::BRepBuilderAPI_MakeEdge> [[edge2], [p1, p3]]
          - !<expr> [diagonal_width_neg, -diagonal_width]
          - !<grocc::gp_Pnt> [[p4], [diagonal_width_neg, diagonal_width, !<double> 0]]
          - !<grocc::gp_Pnt> [[p5], [!<double> 0, radius, !<double> 0]]
          - !<script>
            steps:
              - !<grocc::GC_MakeArcOfCircle> [[circle_arc_maker], [p4, p5, p3]]
              - !<grocc::GC_MakeArcOfCircle::Value> [[circle_arc], [circle_arc_maker]]
              - !<grocc::BRepBuilderAPI_MakeEdge> [[edge3], [circle_arc]]
            returns:
              - edge3
          - !<grocc::BRepBuilderAPI_MakeEdge> [[edge0], [p4, p2]]
          - !<script>
            steps:
              - !<grocc::BRepBuilderAPI_MakeWire> [[wire0], ~]
              - !<grocc::BRepBuilderAPI_MakeWire::Add> [~, [wire0, edge0]]
              - !<grocc::BRepBuilderAPI_MakeWire::Add> [~, [wire0, edge1]]
              - !<grocc::BRepBuilderAPI_MakeWire::Add> [~, [wire0, edge2]]
              - !<grocc::BRepBuilderAPI_MakeWire::Add> [~, [wire0, edge3]]
            returns:
              - wire0
          - !<grocc::BRepBuilderAPI_MakeFace> [[face], [wire0]]
